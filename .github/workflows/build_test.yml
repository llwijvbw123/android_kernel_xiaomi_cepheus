# This is a basic workflow to help you get started with Actions
name: build_test

# Controls when the action will run.
on:
  # Triggers the workflow on push events but only for the eleven branch
  push:
    tags:
      - "*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Test yaml library availability
        run: |
          set -e
          # 创建测试C文件
          cat > test_yaml.c << EOF
          #include <yaml.h>
          #include <stdio.h>
          int main() {
              yaml_emitter_t emitter;
              printf("🔍 Testing yaml_emitter_initialize...\n");
              yaml_emitter_initialize(&emitter);
              printf("✅ yaml_emitter_initialize called successfully\n");
              yaml_emitter_delete(&emitter);
              printf("✅ YAML library test passed completely\n");
              return 0;
          }
          EOF
          # 安装依赖
          sudo apt-get update && sudo apt-get install -y libyaml-dev
          # 编译并输出编译状态
          echo "📦 Compiling test_yaml.c..."
          if gcc test_yaml.c -o test_yaml -lyaml; then
              echo "✅ Compilation succeeded"
          else
              echo "❌ Compilation failed"
              exit 1
          fi
          # 执行并输出执行结果
          echo "▶️ Running test_yaml..."
          ./test_yaml
          # 清理
          rm -f test_yaml.c test_yaml
          echo "🎉 All YAML library tests passed"
