# This is a basic workflow to help you get started with Actions
name: build

# Controls when the action will run.
on:
  # Triggers the workflow on push events but only for the eleven branch
  push:
    tags:
      - "*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Install Python2 (via deadsnakes PPA)
        run: |
          set -e
          # 安装依赖工具（添加PPA需要）
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          # 添加deadsnakes PPA（提供Python2.7）
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          # 再次更新源（加载PPA的包列表）
          sudo apt-get update
          # 安装Python2.7（替代python2，ubuntu22.04+中包名是python2.7）
          sudo apt-get install -y python2.7 python2.7-dev
          # 创建python2软链接（匹配内核脚本的python2调用）
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
          # 验证安装
          if ! command -v python2 &> /dev/null; then
              echo "❌ Error: Python2 installation failed"
              exit 1
          fi
          python2 --version  # 输出Python 2.7.x，确认可用
          echo "✅ Python2 installed successfully"
          
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
        with:
          # 为了避免莫名其妙的问题，禁用深度克隆，拉取完整代码
          fetch-depth: 0

      # 新增步骤：拉取子模块【Kernelsu  Anykernel】
      - name: Update Submodules
        run: git submodule update --init --recursive  --remote
        

      # 下载指定版本的 clang 17.0.2 和 GCC 4.9
      - name: Download clang
        run: |
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.2/clang+llvm-17.0.2-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git aarch64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git arm 
          tar -xvf clang+llvm-17.0.2-x86_64-linux-gnu-ubuntu-22.04.tar.xz

      - name: Install libyaml-dev
        run: sudo apt-get update && sudo apt-get install libyaml-dev -y
      # 验证符号链接+修复路径（新增核心步骤）
# 在Debug KernelSU compilation步骤后新增：创建独立测试目录
      - name: Create independent KSU test directory
        run: |
          set -e
          # 1. 创建独立测试目录（内核根目录下，命名为ksu_test_dir）
          mkdir -p ksu_test_dir
          # 2. 在测试目录下创建核心测试文件（ksu_test.c）
          cat > ksu_test_dir/ksu_test.c << EOF
          #define pr_fmt(fmt) "ksu_test: " fmt
          #include <linux/init.h>
          #include <linux/module.h>
          
          // 声明要测试的KSU符号（和原有代码的声明完全一致）
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          
          // 极简测试函数：仅调用KSU符号，无其他依赖
          static int __init ksu_test_init(void)
          {
              unsigned int type = 0, code = 0;
              int value = 0;
              // 核心：调用KSU符号，验证是否能找到
              ksu_handle_input_handle_event(&type, &code, &value);
              pr_info("✅ KSU symbol test: call ksu_handle_input_handle_event success\\n");
              return 0;
          }
          
          static void __exit ksu_test_exit(void)
          {
              pr_info("KSU symbol test: exit\\n");
          }
          
          module_init(ksu_test_init);
          module_exit(ksu_test_exit);
          MODULE_LICENSE("GPL");
          EOF
              # 3. 在测试目录下创建专属Makefile（指定编译规则）
              cat > ksu_test_dir/Makefile << EOF
          # 测试目录的Makefile：明确要编译的文件
          obj-y += ksu_test.o
          # 引入内核头文件，避免编译报错
          EXTRA_CFLAGS += -I\$(src)/include -I\$(src)/KernelSU/include
          EOF
          # 验证目录和文件创建成功
          ls -l ksu_test_dir/ && echo "✅ Independent KSU test directory created"
      # 紧接着上一步：配置Makefile编译测试文件
      - name: Add test file to Makefile
        run: |
          set -e
          # 把测试文件加入内核根目录Makefile（确保最先编译）
          echo "obj-y += ksu_test.o" >> Makefile
          # 验证Makefile修改成功
          grep "ksu_test.o" Makefile && echo "✅ Test file added to Makefile"
      - name: Build kernel (with test file)
        run: |
          set -e
          make clean && make mrproper
          # 编译时保留完整日志，重点看ksu_test.o的编译/链接情况
          bash -x ./build.sh 2>&1 | tee build.log
          # 检查日志中是否有ksu_test.o的编译记录
          grep "CC ksu_test.o" build.log || {
              echo "❌ 测试文件ksu_test.c未被编译！Makefile配置失败"
              exit 1
          }          
      # 下载Nethunter内核和设备包
      #- name: Download Nethunter
       # run: |
        #  git clone git clone https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-project.git
         # git clone https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git
          
      - name: Build
        run: |
          set -e
          bash ./build.sh

      #- name: Nethunter_Build
       # run: |
        #  cp mi9_nethunter_buildconfig kali-nethunter-kernel/config
         # bash ./kali-nethunter-kernel/build.sh

      - name: Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          files: |
            kernel_out/*.zip
